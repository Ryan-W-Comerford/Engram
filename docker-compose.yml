services:

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9094:9094"
    environment:
      # KRaft mode — no ZooKeeper required
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9094 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    # Raise max_connections so the pool across all services fits comfortably.
    # Formula: (pool_size + max_overflow) × service_count < max_connections
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: engram
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engram -d engram"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    # Default config is open (no auth), matching AUTH_TOKEN-blank ingest.
    # To require a bearer token on 4317/4318, mount otel-collector-config.auth.yaml
    # instead and set AUTH_TOKEN in .env.
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      - "AUTH_TOKEN=${AUTH_TOKEN:-}"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram_dev}@postgres:5432/engram
      # Point Alembic migrations at the direct Postgres port, bypassing PgBouncer
      # if you add a pooler in front of postgres later.
      - MIGRATIONS_DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram_dev}@postgres:5432/engram
      # Optional shared token. Blank = ingest is open (self-hosted / trusted network).
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_RAW=engram.events.raw
      # Managed Kafka (Confluent Cloud / MSK / Upstash) — leave blank for local dev
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-PLAIN}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      # Connection pool tuning
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_RAW=engram.events.raw
      - KAFKA_TOPIC_ANOMALIES=engram.alerts.anomalies
      - KAFKA_TOPIC_DLQ=engram.events.dlq
      - KAFKA_CONSUMER_GROUP=engram-processor
      # Managed Kafka — leave blank for local dev
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-PLAIN}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      # Redis for sliding window state — falls back to in-memory if not set
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram_dev}@postgres:5432/engram
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_ANOMALIES=engram.alerts.anomalies
      - KAFKA_TOPIC_DLQ=engram.alerts.dlq
      - KAFKA_CONSUMER_GROUP=engram-ai-service
      # Managed Kafka — leave blank for local dev
      - KAFKA_SECURITY_PROTOCOL=${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-PLAIN}
      - KAFKA_SASL_USERNAME=${KAFKA_SASL_USERNAME:-}
      - KAFKA_SASL_PASSWORD=${KAFKA_SASL_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - DASHBOARD_BASE_URL=${DASHBOARD_BASE_URL:-http://localhost:8080}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram_dev}@postgres:5432/engram
      - INGESTOR_HOST=${INGESTOR_HOST:-http://localhost:8000}
      # Optional shared token. Blank = dashboard has no login.
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # Only used to sign the login cookie when AUTH_TOKEN is set.
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-}
      - HTTPS=${HTTPS:-0}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  kafka_data:
  postgres_data:
  redis_data:
